[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["pulse_intelligence", "pulse_intelligence.llm"]

[tool.setuptools.package-data]
# Le prompt est une donnée du paquet : sans cette ligne, une installation
# non éditable livrerait un ProviderSummarizer sans son prompt.
pulse_intelligence = ["prompts/*.md"]

[project]
name = "pulse-intelligence"
version = "0.1.0"
description = "Couche Intelligence de Pulse : résumé de session (pas 3 de la roadmap V3, spec v2)"
requires-python = ">=3.14"
dependencies = [
    "requests>=2.32",
]

[project.optional-dependencies]
# Étape 3 du spec : le vrai modèle. Non installé dans le squelette.
mlx = ["mlx-lm"]
# Tests : le faux Core est un serveur Flask de test rejouant des fixtures.
dev = ["pytest>=8", "flask>=3"]

[project.scripts]
pulse-intel = "pulse_intelligence.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# Les tests marqués `slow` chargent le vrai modèle MLX (14 Go) : hors suite
# par défaut, hors CI. Pour les lancer : `pytest -m slow`.
addopts = "-m 'not slow'"
markers = ["slow: nécessite le modèle MLX local (extra mlx), exclu par défaut"]
